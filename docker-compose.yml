services:
  transfer-db:
    image: postgres:16
    container_name: transfer-db
    environment:
      POSTGRES_DB: ${TRANSFER_DB_NAME:?Set TRANSFER_DB_NAME in .env}
      POSTGRES_USER: ${TRANSFER_DB_USER:?Set TRANSFER_DB_USER in .env}
      POSTGRES_PASSWORD: ${TRANSFER_DB_PASSWORD:?Set TRANSFER_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - transfer-db-data:/var/lib/postgresql/data
  notification-db:
    image: postgres:16
    container_name: notification-db
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:?Set NOTIFICATION_DB_NAME in .env}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:?Set NOTIFICATION_DB_USER in .env}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
    ports:
      - "5433:5432"   # 5433 on the host, because transfer-db already uses 5432
    volumes:
      - notification-db-data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  transfer-db-data:
  notification-db-data:
  rabbitmq-data:
