# TransferApi. Image built locally: docker build -f src/TransferApi/Dockerfile -t transfer-api .

# NodePort Service: opens port 30081 on the node, so Swagger is at http://localhost:30081/swagger
apiVersion: v1
kind: Service
metadata:
  name: transfer-api
  namespace: money-transfer
spec:
  type: NodePort
  selector:
    app: transfer-api
  ports:
    - port: 8080        # inside the cluster
      targetPort: 8080  # the container's port
      nodePort: 30081   # on my machine (must be 30000-32767)
---
# Deployment: keeps the wanted number of pods running and replaces any that fail
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-api
  namespace: money-transfer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transfer-api
  template:
    metadata:
      labels:
        app: transfer-api
    spec:
      containers:
        - name: transfer-api
          image: transfer-api:latest
          # Never download: the image only exists locally. After a rebuild:
          # kubectl rollout restart deployment/transfer-api -n money-transfer
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # Development: applies migrations at startup (see Step 21/23)
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: money-transfer-secrets, key: TRANSFER_DB_NAME }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: money-transfer-secrets, key: TRANSFER_DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: money-transfer-secrets, key: TRANSFER_DB_PASSWORD }
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: money-transfer-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: money-transfer-secrets, key: RABBITMQ_PASSWORD }
            # $(NAME) is replaced with a variable defined ABOVE in this list
            - name: ConnectionStrings__TransferDb
              value: Host=transfer-db;Port=5432;Database=$(DB_NAME);Username=$(DB_USER);Password=$(DB_PASSWORD)
            - name: ConnectionStrings__RabbitMq
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
