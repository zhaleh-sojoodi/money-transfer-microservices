# RabbitMQ. A StatefulSet gives the pod the fixed name "rabbitmq-0",
# which RabbitMQ needs to find its stored data again after a restart (like "hostname" in Compose).

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: money-transfer
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: money-transfer
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: money-transfer-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: money-transfer-secrets, key: RABBITMQ_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          # Ready once port 5672 accepts connections. Cheaper than "rabbitmq-diagnostics ping",
          # which starts a small program on every check and timed out when the machine was busy.
          readinessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 10
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
